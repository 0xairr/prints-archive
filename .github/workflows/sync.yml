# Keeps this prints archive mirror up to date (see README.txt) and publishes it on GitHub Pages.
name: Sync prints archive

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'   # once a day, as README.txt asks
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # downloads only what changed and checks every file against the manifest's SHA-256
      - name: Sync from the main copy
        run: node sync.mjs https://prints.wtf/archive/ .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync archive $(date -u +%F)"; git push; }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
